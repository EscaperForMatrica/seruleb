<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Отзывы — Seruleb</title>
<meta name="description" content="Видео-отзывы клиентов о работе Seruleb: розыгрыши, продвижение в WhatsApp и другие услуги.">
<meta property="og:title" content="Отзывы — Seruleb">
<meta property="og:description" content="Видео-отзывы клиентов Seruleb.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://seruleb.com/video">
<link rel="canonical" href="https://seruleb.com/video">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Montserrat+Alternates:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#000000;}
body{font-family:'Montserrat Alternates',sans-serif;}
a{color:#ffb780;text-decoration:none;}
a:hover{color:#ffffff;}
::selection{background:rgba(255,183,128,.35);}
</style>
</helmet>
<div style="min-height:100vh; background: radial-gradient(130% 90% at 50% -25%, #201709 0%, #0d0a04 48%, #000000 100%); color:#ffffff; --gblur: {{ glassBlurCss }}; --accent: {{ accentColor }};">
  <header style="display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px clamp(16px,4vw,40px); max-width:1100px; margin:0 auto; box-sizing:border-box;">
    <a href="index.dc.html" style="display:flex; align-items:center; gap:8px; font-family:'Oswald',sans-serif; font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:#ffb780; border:1px solid #ffb780; border-radius:3px; padding:8px 16px;" style-hover="border-color:#ffffff; color:#ffffff;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5 M11 6l-6 6 6 6"></path></svg>
      На главную
    </a>
    <div style="font-size:13px; letter-spacing:.14em; color:#b1b1b1; font-weight:600;">SERULEB</div>
  </header>

  <main data-screen-label="Отзывы" style="max-width:1100px; margin:0 auto; padding:clamp(24px,5vw,56px) clamp(16px,4vw,40px) 80px; box-sizing:border-box; display:flex; flex-direction:column; gap:clamp(28px,4vw,44px);">
    <div style="display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px;">
      <div style="background:linear-gradient(160deg, rgba(255,217,106,.14), rgba(255,255,255,.04)); border:1px solid rgba(255,213,138,.28); border-radius:999px; padding:8px 20px; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#ffb780;">Отзывы</div>
      <h1 style="font-family:'Oswald',sans-serif; font-size:clamp(26px,5vw,40px); font-weight:600; line-height:1.2; margin:0; text-transform:uppercase; color:#ffffff;">Отзывы о <span style="color:#ffb780;">Seruleb</span></h1>
      <p style="font-size:clamp(14px,1.8vw,16px); line-height:1.6; color:#e3e3e3; margin:0; max-width:52ch;">Видео-отзывы наших клиентов и участников розыгрышей.</p>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap:clamp(12px,2vw,20px);">
      <sc-for list="{{ videos }}" as="v" hint-placeholder-count="6">
        <div style="background:linear-gradient(160deg, rgba(255,217,106,.10), rgba(255,255,255,.03)); border:1px solid rgba(255,213,138,.22); border-radius:18px; padding:10px; box-shadow:inset 0 1px 0 rgba(255,231,168,.24), 0 16px 40px rgba(0,0,0,.28);">
          <div style="position:relative; width:100%; aspect-ratio:9/16; border-radius:12px; overflow:hidden; background:#111;">
            <video controls="controls" playsinline preload="none" poster="{{ v.poster }}" onClick="{{ v.onToggle }}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; display:block; cursor:pointer;">
              <source src="{{ v.src }}" type="video/mp4">
            </video>
            <sc-if value="{{ v.showPlay }}" hint-placeholder-val="{{ true }}">
              <div onClick="{{ v.onPlay }}" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; cursor:pointer; background:linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.35));">
                <div style="width:64px; height:64px; border-radius:50%; background:rgba(255,183,128,.92); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(0,0,0,.4); transition:transform .2s ease;" style-hover="transform:scale(1.08);">
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="#101010" stroke="none"><path d="M8 5.5v13l11-6.5z"></path></svg>
                </div>
              </div>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px;">
      <p style="font-size:clamp(14px,1.9vw,15px); line-height:1.7; color:#e3e3e3; margin:0; max-width:48ch;">Уже работали с нами? Пришлите свой отзыв в WhatsApp — с вашего согласия мы опубликуем его на этой странице.</p>
      <a href="{{ wa }}" style="font-family:'Oswald',sans-serif; font-size:clamp(16px,2.6vw,20px); font-weight:500; text-transform:uppercase; color:#ffb780; border:1px solid #ffb780; border-radius:3px; padding:12px 24px;" style-hover="border-color:#ffffff; color:#ffffff;">Оставить отзыв в WhatsApp</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;glassBlur&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 22, &quot;min&quot;: 0, &quot;max&quot;: 40, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;section&quot;: &quot;Liquid Glass&quot;},
  &quot;accentColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#ffb780&quot;, &quot;options&quot;: [&quot;#ffb780&quot;, &quot;#ffd96a&quot;, &quot;#c98c5d&quot;, &quot;#ffffff&quot;], &quot;section&quot;: &quot;Цвет&quot;}
}">
class Component extends DCLogic {
  state = { play: {} };
  renderVals() {
    const p = this.props;
    const play = this.state.play || {};
    const startPlay = (i) => this.setState(s => ({ play: { ...s.play, [i]: true } }));
    const videos = Array.from({ length: 10 }, (_, i) => ({
      src: 'assets/video/reviews/otzyv-' + (i + 1) + '.mp4',
      poster: 'assets/video/reviews/otzyv-' + (i + 1) + '.jpg',
      showPlay: !play[i],
      onPlay: (e) => {
        const vid = e.currentTarget.parentElement.querySelector('video');
        if (vid) { vid.play(); }
        startPlay(i);
      },
      onToggle: (e) => {
        const vid = e.currentTarget;
        if (vid.paused) { vid.play(); startPlay(i); }
        else { vid.pause(); }
      },
    }));
    return {
      glassBlurCss: (p.glassBlur ?? 22) + 'px',
      accentColor: p.accentColor ?? '#ffb780',
      videos,
      wa: 'https://wa.me/79896500005?text=' + encodeURIComponent('Ассаляму Алейкум! Хочу оставить отзыв о работе с Seruleb.'),
    };
  }
}
</script>
</body>
</html>
