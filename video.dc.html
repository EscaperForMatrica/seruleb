<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Специалисты Seruleb — видео</title>
<meta name="description" content="Команда специалистов Seruleb: reels-продюсеры и эксперты, которые помогают клиентам расти в мессенджерах и социальных сетях.">
<meta property="og:title" content="Специалисты Seruleb">
<meta property="og:description" content="Видео о команде и специалистах Seruleb.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://seruleb.com/video">
<link rel="canonical" href="https://seruleb.com/video">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Montserrat+Alternates:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#000000;}
body{font-family:'Montserrat Alternates',sans-serif;}
a{color:#ffb780;text-decoration:none;}
a:hover{color:#ffffff;}
::selection{background:rgba(255,183,128,.35);}
</style>
</helmet>
<div style="min-height:100vh; background: radial-gradient(130% 90% at 50% -25%, #201709 0%, #0d0a04 48%, #000000 100%); color:#ffffff; --gblur: {{ glassBlurCss }}; --accent: {{ accentColor }};">
  <header style="display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px clamp(16px,4vw,40px); max-width:1100px; margin:0 auto; box-sizing:border-box;">
    <a href="index.dc.html" style="display:flex; align-items:center; gap:8px; font-family:'Oswald',sans-serif; font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:#ffb780; border:1px solid #ffb780; border-radius:3px; padding:8px 16px;" style-hover="border-color:#ffffff; color:#ffffff;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5 M11 6l-6 6 6 6"></path></svg>
      На главную
    </a>
    <div style="font-size:13px; letter-spacing:.14em; color:#b1b1b1; font-weight:600;">SERULEB</div>
  </header>

  <main data-screen-label="Видео" style="max-width:1100px; margin:0 auto; padding:clamp(24px,5vw,56px) clamp(16px,4vw,40px) 80px; box-sizing:border-box; display:flex; flex-direction:column; gap:clamp(28px,4vw,44px);">
    <div style="display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px;">
      <div style="background:linear-gradient(160deg, rgba(255,217,106,.14), rgba(255,255,255,.04)); border:1px solid rgba(255,213,138,.28); border-radius:999px; padding:8px 20px; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#ffb780;">Видео</div>
      <h1 style="font-family:'Oswald',sans-serif; font-size:clamp(26px,5vw,40px); font-weight:600; line-height:1.2; margin:0; text-transform:uppercase; color:#ffffff;">Видео от <span style="color:#ffb780;">Seruleb</span></h1>
      <p style="font-size:clamp(14px,1.8vw,16px); line-height:1.6; color:#e3e3e3; margin:0; max-width:52ch;">Наша команда — специалисты Seruleb, которые помогают клиентам расти в мессенджерах и соцсетях.</p>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 380px)); justify-content:center; gap:clamp(16px,2.5vw,24px);">
      <sc-for list="{{ videos }}" as="v" hint-placeholder-count="6">
        <div style="background:linear-gradient(160deg, rgba(255,217,106,.10), rgba(255,255,255,.03)); backdrop-filter:blur(var(--gblur)); -webkit-backdrop-filter:blur(var(--gblur)); border:1px solid rgba(255,213,138,.22); border-radius:18px; padding:14px; box-shadow:inset 0 1px 0 rgba(255,231,168,.24), 0 16px 40px rgba(0,0,0,.28); display:flex; flex-direction:column; gap:12px;">
          <div style="position:relative; width:100%; aspect-ratio:9/16; max-height:70vh; border-radius:12px; overflow:hidden; background:#111;">
            <video controls="controls" playsinline preload="metadata" poster="{{ v.poster }}" onClick="{{ v.onToggle }}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; display:block; cursor:pointer;">
              <source src="{{ v.src }}" type="video/mp4">
            </video>
            <sc-if value="{{ v.showPlay }}" hint-placeholder-val="{{ true }}">
              <div onClick="{{ v.onPlay }}" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; cursor:pointer; background:linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.35));">
                <div style="width:72px; height:72px; border-radius:50%; background:rgba(255,183,128,.92); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(0,0,0,.4); transition:transform .2s ease;" style-hover="transform:scale(1.08);">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="#101010" stroke="none"><path d="M8 5.5v13l11-6.5z"></path></svg>
                </div>
              </div>
            </sc-if>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px; padding:0 4px 4px;">
            <div style="font-family:'Oswald',sans-serif; font-size:16px; font-weight:600; color:#ffffff; text-transform:uppercase;">{{ v.title }}</div>
            <sc-if value="{{ v.desc }}" hint-placeholder-val="{{ false }}">
              <div style="{{ v.descStyle }}">{{ v.desc }}</div>
              <div onClick="{{ v.toggle }}" style="cursor:pointer; align-self:flex-start; font-size:13px; font-weight:600; color:var(--accent);" style-hover="color:#ffffff;">{{ v.toggleLabel }}</div>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;glassBlur&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 22, &quot;min&quot;: 0, &quot;max&quot;: 40, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;section&quot;: &quot;Liquid Glass&quot;},
  &quot;accentColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#ffb780&quot;, &quot;options&quot;: [&quot;#ffb780&quot;, &quot;#ffd96a&quot;, &quot;#c98c5d&quot;, &quot;#ffffff&quot;], &quot;section&quot;: &quot;Цвет&quot;}
}">
class Component extends DCLogic {
  state = { expanded: {}, play: {} };
  renderVals() {
    const p = this.props;
    const exp = this.state.expanded;
    const kamil = 'Меня зовут Камиль. Я reels-продюсер — создаю короткий видеоконтент, который не просто красиво смотрится, а реально работает: удерживает внимание, вызывает доверие и приносит результат.\n\nМой путь начался с монтажа — я учился на практике, снимая и монтируя сотни роликов. Со временем пришло понимание, что хороший рилс — это не только качественный монтаж, а целая система: идея, сценарий, съёмка, подача и монтаж, работающие вместе. Так я и стал продюсером — человеком, который отвечает за весь процесс создания видео от начала до конца.\n\nЗа время работы я построил аудиторию в десятки тысяч человек, изучил, что действительно заставляет людей досматривать видео до конца, и продолжаю развиваться в этой сфере каждый день.\n\nВ своей работе я ценю честность и качество — без хайпа ради хайпа и без обмана аудитории. Я верю, что доверие — это главный актив в контенте, и строю свою репутацию именно на нём.';
    const raw = [
      { title: 'Камиль — reels-продюсер', src: 'assets/video/kamil.mp4', poster: 'assets/video/kamil-poster.webp', desc: kamil },
    ];
    const play = this.state.play || {};
    const videos = raw.map((v, i) => ({
      ...v,
      showPlay: !play[i],
      onPlay: (e) => {
        const vid = e.currentTarget.parentElement.querySelector('video');
        if (vid) { vid.play(); }
        this.setState(s => ({ play: { ...s.play, [i]: true } }));
      },
      onToggle: (e) => {
        const vid = e.currentTarget;
        if (vid.paused) { vid.play(); this.setState(s => ({ play: { ...s.play, [i]: true } })); }
        else { vid.pause(); }
      },
      descStyle: 'font-size:13px; line-height:1.6; color:#e3e3e3; white-space:pre-line; overflow:hidden; transition:max-height .5s cubic-bezier(.2,.6,.2,1), opacity .4s ease; max-height:' + (exp[i] ? '1200px' : '62px') + '; -webkit-mask-image:' + (exp[i] ? 'none' : 'linear-gradient(180deg, #000 55%, transparent 100%)') + '; mask-image:' + (exp[i] ? 'none' : 'linear-gradient(180deg, #000 55%, transparent 100%)') + ';',
      toggleLabel: exp[i] ? 'Свернуть' : 'Читать полностью',
      toggle: () => this.setState(s => ({ expanded: { ...s.expanded, [i]: !s.expanded[i] } })),
    }));
    return {
      glassBlurCss: (p.glassBlur ?? 22) + 'px',
      accentColor: p.accentColor ?? '#ffb780',
      videos,
    };
  }
}
</script>
</body>
</html>
